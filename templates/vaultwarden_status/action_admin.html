<form action="?" method="post" class="form-horizontal">
 <div class="form-group"><label><#LANG_VAULTWARDEN_STATUS_ENDPOINT#></label><input type="text" name="endpoint" value="[#ENDPOINT#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_VAULTWARDEN_STATUS_METHOD#></label><select name="method" class="form-control"><option value="GET"[#if METHOD="GET"#] selected[#endif#]>GET</option><option value="POST"[#if METHOD="POST"#] selected[#endif#]>POST</option></select></div>
 <div class="form-group"><label><#LANG_VAULTWARDEN_STATUS_TOKEN#></label><input type="password" name="token" value="" class="form-control" autocomplete="new-password"></div>
 <div class="form-group"><label><#LANG_VAULTWARDEN_STATUS_REGION#></label><input type="text" name="region" value="[#REGION#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_VAULTWARDEN_STATUS_TRACKING#></label><input type="text" name="tracking" value="[#TRACKING#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_VAULTWARDEN_STATUS_PAYLOAD#></label><textarea name="payload" rows="4" class="form-control">[#PAYLOAD#]</textarea></div>
 <button type="submit" class="btn btn-primary"><#LANG_UPDATE#></button>
 <input type="hidden" name="mode" value="update">
</form>
<p class="help-block"><#LANG_VAULTWARDEN_STATUS_HINT#></p>
<p class="help-block"><#LANG_VAULTWARDEN_STATUS_LAST#>: [#LAST_RESULT#]</p>
